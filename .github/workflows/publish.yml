name: Publish
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: yarn install
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - name: Mint release-automation App token
        id: release_token
        # No PAT fallback (ADR 0511 / REL-561): a missing or misconfigured
        # App secret fails this job loudly instead of silently degrading.
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: calltelemetry
          repositories: cisco-ris-mcp
      - name: Confirm the release-automation credential is provisioned
        run: |
          set -euo pipefail
          if [ -z "${{ steps.release_token.outputs.token }}" ]; then
            echo "::error::ct-release-automation App token was not minted; RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY must be provisioned. There is no PAT fallback (ADR 0511)."
            exit 1
          fi
      - run: yarn run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.release_token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
